[project]
name = "pixellab-tools"
version = "0.1.0"
description = "PixelLab REST shim (pl) and per-game asset pipeline (assets) for track-web games."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "ruamel.yaml>=0.18",
    "python-dotenv>=1.0",
]

[project.scripts]
pl = "pixellab_tools.pl:main"
assets = "pixellab_tools.assets_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixellab_tools"]
